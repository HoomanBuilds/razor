[package]
name = "razor-treasury"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.26.1"
serde = { version = "=1.0.228", features = ["derive"] }

[dev-dependencies]
near-sdk = { version = "=5.26.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
